<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">

    <a class="navbar-brand" href="/">Code-Mixed Sentiment</a>

    <div>
      {% if session.get("user") %}
          <span class="text-white me-3">
              Welcome, {{ session.get("user") }}
          </span>
          <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      {% else %}
          <a href="/login" class="btn btn-outline-light btn-sm me-2">Login</a>
          <a href="/register" class="btn btn-success btn-sm">Register</a>
      {% endif %}
    </div>

  </div>
</nav>

<div class="container mt-5" style="max-width: 650px;">
    <div class="card shadow-lg p-4">

        <h3 class="text-center mb-4">Analyze Sentiment</h3>

        <form action="/predict" method="POST">
            <div class="mb-3">
                <textarea 
                    name="text" 
                    class="form-control" 
                    rows="4" 
                    placeholder="Enter Hinglish / Code-Mixed text..." 
                    required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Analyze
            </button>
        </form>

        {% if prediction %}
        <div class="alert alert-info mt-4 text-center">
            <strong>Sentiment:</strong> {{ prediction }} <br>
            <small>Confidence: {{ confidence }}</small>
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
