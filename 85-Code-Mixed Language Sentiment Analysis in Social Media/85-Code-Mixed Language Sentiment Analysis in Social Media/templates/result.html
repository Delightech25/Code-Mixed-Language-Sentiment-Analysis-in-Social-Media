<!doctype html>
<html>
  <head>
    <title>Prediction Result</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand">Code-Mixed Sentiment Analysis</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </nav>

    <div class="container mt-5" style="max-width: 600px">
      <div class="card shadow-lg p-5 text-center">
        <h2 class="mb-4">Prediction Result</h2>
        <hr />

        <div class="mb-4">
          <h6 class="text-muted">Input Text</h6>
          <p class="lead">{{ text }}</p>
        </div>

        {% if prediction == "Positive" %}
        <span class="badge bg-success fs-5 p-3"> 😊 {{ prediction }} </span>
        {% elif prediction == "Negative" %}
        <span class="badge bg-danger fs-5 p-3"> 😡 {{ prediction }} </span>
        {% else %}
        <span class="badge bg-secondary fs-5 p-3"> 😐 {{ prediction }} </span>
        {% endif %}

        <div class="mt-3">
          <small class="text-muted">
            Confidence: {{ confidence*100|round(2) }}%
          </small>
        </div>

        <a href="/" class="btn btn-primary mt-4"> Analyze Another Text </a>
      </div>
    </div>
  </body>
</html>
